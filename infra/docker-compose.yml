# DeviceLab control plane: Postgres, Redis, MinIO, control server, portal + Nginx (TLS).
# Host agents run natively on the device hosts (see docs/HOST_SETUP_*.md).
#
#   cp infra/.env.example infra/.env   # then set real secrets
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#   docker compose -f infra/docker-compose.yml --env-file infra/.env run --rm server node dist/cli/seed.js
name: devicelab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devicelab
      POSTGRES_USER: devicelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devicelab -d devicelab']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    # MinIO stopped publishing community images in late 2025: pin a tag you have mirrored,
    # or point S3_* at another on-prem S3 store, or set STORAGE_DRIVER=fs.
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    profiles: ['minio']

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: devicelab/server:${DEVICELAB_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: https://${DEVICELAB_HOSTNAME:-devicelab.local}
      TRUST_PROXY: 'loopback,uniquelocal'
      DATABASE_URL: postgresql://devicelab:${POSTGRES_PASSWORD}@postgres:5432/devicelab?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_STREAM_SECRET: ${JWT_STREAM_SECRET:?set JWT_STREAM_SECRET}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      STORAGE_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-devicelab}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-500}
      RESERVATION_DEFAULT_MIN: ${RESERVATION_DEFAULT_MIN:-30}
      RESERVATION_MAX_MIN: ${RESERVATION_MAX_MIN:-120}
      IDLE_WARN_MIN: ${IDLE_WARN_MIN:-5}
      IDLE_RELEASE_MIN: ${IDLE_RELEASE_MIN:-10}
      CLEANUP_KEEP_PACKAGES: ${CLEANUP_KEEP_PACKAGES:-}
      CLEANUP_REBOOT: ${CLEANUP_REBOOT:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@devicelab.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - serverdata:/data

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
    image: devicelab/portal:${DEVICELAB_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      DEVICELAB_HOSTNAME: ${DEVICELAB_HOSTNAME:-devicelab.local}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/certs:/etc/nginx/certs

volumes:
  pgdata:
  redisdata:
  miniodata:
  serverdata:
