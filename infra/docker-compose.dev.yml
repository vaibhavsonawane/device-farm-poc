# Development dependencies only (Postgres, Redis, optional MinIO), with ports published
# and credentials matching apps/server/.env.example. Never use in production.
#   docker compose -f infra/docker-compose.dev.yml up -d
name: devicelab-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devicelab
      POSTGRES_USER: devicelab
      POSTGRES_PASSWORD: devicelab
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - devpg:/var/lib/postgresql/data
      - ./scripts/dev-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devicelab']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: devicelab
      MINIO_ROOT_PASSWORD: devicelab-minio-secret
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes:
      - devminio:/data
    profiles: ['minio']

volumes:
  devpg:
  devminio:
